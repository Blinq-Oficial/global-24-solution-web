[build]
  publish = "src"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Rutas API → funciones serverless
[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/submit-lead"
  status = 200

[[redirects]]
  from = "/api/admin/leads"
  to = "/.netlify/functions/get-leads"
  status = 200

# Admin panel — sirve el HTML directamente
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
